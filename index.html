
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Modern Secure Authentication System">
    <title>SecureAuth — Sign In</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, Arial, sans-serif;
            background: #0b1120;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 54px;
            height: 54px;
            background: #2563eb;
            border-radius: 16px;
            display: grid;
            place-items: center;
            margin: 0 auto 16px;
            font-size: 25px;
        }

        .brand h1 {
            font-size: 26px;
            letter-spacing: -1px;
        }

        .brand p {
            color: #94a3b8;
            margin-top: 8px;
            font-size: 14px;
        }

        .card {
            background: #111b2e;
            border: 1px solid #26354d;
            border-radius: 18px;
            padding: 32px;
        }

        .card h2 {
            font-size: 23px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 9px;
            color: #dbeafe;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            background: #0b1120;
            border: 1px solid #334155;
            border-radius: 9px;
            color: white;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px #2563eb22;
        }

        .password-wrap {
            display: flex;
            gap: 8px;
        }

        .password-wrap input {
            flex: 1;
            min-width: 0;
        }

        .toggle {
            background: #26354d;
            color: white;
            border: none;
            border-radius: 9px;
            padding: 0 12px;
            cursor: pointer;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #cbd5e1;
        }

        .remember input {
            width: auto;
        }

        a {
            color: #60a5fa;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .submit {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: .2s;
        }

        .submit:hover {
            background: #1d4ed8;
        }

        .submit:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            color: #fca5a5;
            background: #7f1d1d33;
        }

        .message.success {
            display: block;
            color: #86efac;
            background: #14532d33;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 13px;
        }

        .security {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
        }

        @media(max-width: 480px) {
            .card {
                padding: 24px 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header class="brand">
        <div class="brand-icon">🔐</div>
        <h1>SecureAuth</h1>
        <p>Modern Website Authentication System</p>
    </header>

    <main class="card">
        <h2>Welcome back</h2>
        <p class="subtitle">
            Sign in to access your account.
        </p>

        <div id="message" class="message" role="alert"></div>

        <form id="loginForm">

            <div class="field">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="name@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Password</label>

                <div class="password-wrap">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                        minlength="8"
                    >

                    <button
                        type="button"
                        class="toggle"
                        id="togglePassword"
                    >
                        Show
                    </button>
                </div>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    Remember me
                </label>

                <a href="forgot-password.html">
                    Forgot password?
                </a>
            </div>

            <button type="submit" class="submit" id="loginButton">
                Sign In
            </button>

        </form>

        <div class="footer">
            Don't have an account?
            <a href="register.html">Create account</a>
        </div>
    </main>

    <div class="security">
        Secure Authentication Platform
    </div>

</div>

<script>
    const password = document.getElementById("password");
    const toggle = document.getElementById("togglePassword");

    toggle.addEventListener("click", () => {
        const visible = password.type === "password";

        password.type = visible ? "text" : "password";
        toggle.textContent = visible ? "Hide" : "Show";
    });

    document.getElementById("loginForm")
        .addEventListener("submit", (event) => {
            event.preventDefault();

            const message = document.getElementById("message");

            message.className = "message error";
            message.textContent =
                "Authentication backend belum dikonfigurasi. " +
                "Login akan diaktifkan setelah integrasi Supabase.";
        });
</script>

</body>
</html>
